<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turkdex Privacy Policy</title>
<style>
:root{--bg:#f3f6fa;--fg:#14202e;--muted:#4d5d70;--accent:#c8102e;--line:#d3dce6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--fg:#e8eef5;--muted:#9fb0c3;--accent:#ff5a70;--line:#27364a}}
:root[data-theme="dark"]{--bg:#0f1722;--fg:#e8eef5;--muted:#9fb0c3;--accent:#ff5a70;--line:#27364a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:56px 24px 72px;border-left:6px solid var(--accent)}
h1{font-size:2rem;line-height:1.2;margin:0 0 .4em}
h2{font-size:1.2rem;margin:2em 0 .6em;font-family:system-ui,sans-serif}
li{margin:.6em 0}
p.note{color:var(--muted);border-top:1px solid var(--line);padding-top:1em;margin-top:2.5em;font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>Turkdex[CBK] Gizlilik Politikası</h1>
<h2>Turkdex'in depoladıkları:</h2>
<ul>
<li>Discord kullanıcı kimliğiniz.</li>
<li>Turkdex koleksiyonunuz, resmi API üzerinden incelenebilir: hangi toplara sahip olduğunuz, ne zaman yakalandıkları ve takas geçmişiniz.</li>
<li>Turkdex'in politikası asla değişmeyecektir.</li>
</ul>
</main>
</body>
</html>
